# Testes ponta a ponta com Selenium (e2e/) contra a URL publicada.
#
# Roda à mão (Actions → E2E → Run workflow) e depois de cada deploy de
# produção bem-sucedido. Segredos: E2E_EMAIL e E2E_SENHA (conta de teste
# dedicada). Variável opcional do repositório: E2E_BASE_URL.
name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL alvo (vazio usa a produção)
        required: false
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL || 'https://quero-frontend.vercel.app' }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_SENHA: ${{ secrets.E2E_SENHA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        run: |
          echo "Alvo: $E2E_BASE_URL"
          pytest --junitxml=artefatos/junit.xml

      - name: Guardar capturas e logs das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefatos
          path: e2e/artefatos/
          retention-days: 14
